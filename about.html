<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About</title>
  <style>
    [data-theme="light"] {
      --bg: #ffffff;
      --text: #111111;
    }

    [data-theme="dark"] {
      --bg: #111111;
      --text: #ffffff;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 24px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    nav .nav-title {
      font-weight: 700;
      font-size: 18px;
      text-decoration: none;
      color: var(--text);
      margin-right: 16px;
    }

    nav .nav-links {
      display: flex;
      gap: 8px;
      flex: 1;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #5c6bc0;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 1px;
      user-select: none;
      flex-shrink: 0;
    }

    .avatar-lg {
      width: 64px;
      height: 64px;
      font-size: 22px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="nav-title">MH Practice</a>
      <div class="nav-links">
        <a href="index.html">Home</a> |
        <a href="about.html">About</a>
      </div>
      <div class="avatar">MH</div>
    </nav>
  </header>

  <div class="avatar avatar-lg">MH</div>
  <h2>About This Project</h2>
  <p>This is my practice project.</p>

  <script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</body>
</html>
